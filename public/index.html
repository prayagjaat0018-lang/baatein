<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baatein</title>
<meta name="theme-color" content="#6C47FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Baatein">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap">
<style>
  /* ---------- Colors (yahin se poora look badal sakte ho) ---------- */
  :root {
    --bg: #0B0B12;
    --card: #1A1A26;
    --violet: #6C47FF;
    --lime: #C8FF3D;
    --text: #F4F4FA;
    --muted: #9A9BB4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', system-ui, sans-serif;
  }
  .app {
    max-width: 480px;
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }
  .hidden { display: none !important; }

  /* ---------- Welcome screen ---------- */
  #join {
    flex: 1;
    padding: 56px 24px 32px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 42px; height: 42px; border-radius: 14px;
    background: var(--lime);
    display: flex; align-items: center; justify-content: center;
    transform: rotate(-6deg);
  }
  .brand b { font-family: 'Sora', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -1px; }
  .brand span { font-size: 14px; font-weight: 600; color: #E4DCFF; }
  #join h1 {
    font-family: 'Sora', sans-serif;
    font-size: 38px; line-height: 1.1; letter-spacing: -1.5px;
    margin: 48px 0 0;
  }
  #join p { color: #B4B5CC; font-size: 16px; margin: 0 0 auto; }
  input {
    height: 56px; border: 0; border-radius: 28px;
    background: var(--card); color: var(--text);
    padding: 0 20px; font-size: 16px; font-family: inherit;
    outline: none;
  }
  input:focus { box-shadow: 0 0 0 2px var(--violet); }
  button.main {
    height: 58px; border: 0; border-radius: 29px;
    background: var(--lime); color: #0B0B12;
    font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 700;
    cursor: pointer;
  }

  /* ---------- Chat screen ---------- */
  #chat { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  header {
    padding: 18px 20px 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header .brand b { font-size: 22px; }
  .online { font-size: 13px; font-weight: 600; color: var(--lime); }
  #messages {
    flex: 1; overflow-y: auto;
    padding: 8px 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    max-width: 78%;
    padding: 10px 15px 7px;
    border-radius: 22px 22px 22px 6px;
    background: var(--card);
    display: flex; flex-direction: column; gap: 3px;
    word-wrap: break-word; overflow-wrap: anywhere;
    animation: pop 0.18s ease-out;
  }
  .msg.mine {
    align-self: flex-end;
    background: var(--violet); color: #fff;
    border-radius: 22px 22px 6px 22px;
  }
  .msg .who { font-size: 12px; font-weight: 700; color: var(--lime); }
  .msg .text { font-size: 15px; line-height: 1.4; }
  .msg .time { align-self: flex-end; font-size: 11px; color: var(--muted); }
  .msg.mine .time { color: #E4DCFF; }
  .system {
    align-self: center;
    font-size: 12px; font-weight: 600; color: #B4B5CC;
    background: var(--card); padding: 6px 12px; border-radius: 999px;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  #typing { height: 20px; padding: 0 20px; font-size: 12px; font-weight: 600; color: var(--lime); }
  form#send { display: flex; gap: 8px; padding: 6px 12px 20px; }
  form#send input { flex: 1; min-width: 0; }
  form#send button {
    width: 56px; height: 56px; border: 0; border-radius: 50%;
    background: var(--lime); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
</style>
</head>
<body>
<div class="app">

  <!-- Screen 1: naam daalo -->
  <form id="join">
    <div class="brand">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#0B0B12"><path d="M4 5.5A3.5 3.5 0 0 1 7.5 2h9A3.5 3.5 0 0 1 20 5.5v7a3.5 3.5 0 0 1-3.5 3.5H11l-4.6 4.2c-.7.6-1.4.2-1.4-.7V16A3.5 3.5 0 0 1 4 12.5z"/></svg>
      </div>
      <b>Baatein</b><span>बातें</span>
    </div>
    <h1>Chat your way.<br>English, हिंदी,<br>or both.</h1>
    <p>Fast, free and ad-free.</p>
    <input id="nameInput" type="text" maxlength="20" placeholder="Your name" aria-label="Your name" autocomplete="off">
    <button class="main" type="submit">Start chatting</button>
  </form>

  <!-- Screen 2: chat -->
  <div id="chat" class="hidden">
    <header>
      <div class="brand">
        <div class="logo" style="width:36px;height:36px;border-radius:12px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#0B0B12"><path d="M4 5.5A3.5 3.5 0 0 1 7.5 2h9A3.5 3.5 0 0 1 20 5.5v7a3.5 3.5 0 0 1-3.5 3.5H11l-4.6 4.2c-.7.6-1.4.2-1.4-.7V16A3.5 3.5 0 0 1 4 12.5z"/></svg>
        </div>
        <b>Baatein</b>
      </div>
      <div class="online" id="online">1 online</div>
    </header>
    <div id="messages"></div>
    <div id="typing"></div>
    <form id="send" autocomplete="off">
      <input id="msgInput" type="text" maxlength="500" placeholder="Say something..." aria-label="Message">
      <button type="submit" aria-label="Send">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0B0B12" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
      </button>
    </form>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  // App ko installable banane ke liye
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  }
</script>
<script>
  const socket = io();          // server se connect
  let myName = '';

  const joinForm = document.getElementById('join');
  const chatBox = document.getElementById('chat');
  const messages = document.getElementById('messages');
  const typingEl = document.getElementById('typing');
  const msgInput = document.getElementById('msgInput');

  // Naam daal kar chat me jao
  joinForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('nameInput').value.trim();
    if (!name) return;
    myName = name;
    socket.emit('join', myName);
    joinForm.classList.add('hidden');
    chatBox.classList.remove('hidden');
    msgInput.focus();
  });

  // Message bhejo
  document.getElementById('send').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = msgInput.value.trim();
    if (!text) return;
    socket.emit('message', text);
    msgInput.value = '';
  });

  // "typing..." signal (har 1.5 second me ek baar)
  let lastTyping = 0;
  msgInput.addEventListener('input', () => {
    const now = Date.now();
    if (now - lastTyping > 1500) {
      socket.emit('typing');
      lastTyping = now;
    }
  });

  // Naya message aaya
  socket.on('message', (m) => {
    const box = document.createElement('div');
    box.className = 'msg' + (m.id === socket.id ? ' mine' : '');

    if (m.id !== socket.id) {
      const who = document.createElement('span');
      who.className = 'who';
      who.textContent = m.name;
      box.appendChild(who);
    }
    const text = document.createElement('span');
    text.className = 'text';
    text.textContent = m.text;          // textContent = safe (koi HTML nahi chalega)
    box.appendChild(text);

    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = new Date(m.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    box.appendChild(time);

    messages.appendChild(box);
    messages.scrollTop = messages.scrollHeight;
  });

  // "X joined / left"
  socket.on('system', (txt) => {
    const el = document.createElement('div');
    el.className = 'system';
    el.textContent = txt;
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
  });

  socket.on('online', (n) => {
    document.getElementById('online').textContent = n + ' online';
  });

  // Dusre ka typing indicator
  let typingTimer;
  socket.on('typing', (name) => {
    typingEl.textContent = name + ' is typing...';
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => { typingEl.textContent = ''; }, 1800);
  });

  // Net chhut ke wapas aaye to dobara join karo
  socket.on('connect', () => { if (myName) socket.emit('join', myName); });
</script>
</body>
</html>
